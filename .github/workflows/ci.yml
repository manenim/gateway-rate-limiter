name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REDIS_ADDR: localhost:6379
      REQUIRE_REDIS: "1"
      GOMAXPROCS: "4"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Verify Example Compiles
        run: go build -v ./cmd/example-server

      - name: Verify and collect benchmark evidence
        run: ./scripts/verify.sh

      - name: Upload verification and profiling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-limiter-evidence
          path: evidence/
          retention-days: 14
